{% extends "core/base.html" %}

{% block title %}New In — {{ site.brand_name }}{% endblock %}

{% block content %}
<section class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-sm sm:text-base tracking-[0.15em] uppercase">New In</h1>
    <form method="get" class="flex items-center gap-2 text-xs text-gray-600">
      <label for="sort" class="whitespace-nowrap">Sort by:</label>
      <select id="sort" name="sort" onchange="this.form.submit()" class="bg-transparent text-xs py-1 pr-6 focus:outline-none cursor-pointer">
        <option value="">New Arrivals</option>
        <option value="price-asc" {% if sort == 'price-asc' %}selected{% endif %}>Price: low to high</option>
        <option value="price-desc" {% if sort == 'price-desc' %}selected{% endif %}>Price: high to low</option>
        <option value="name" {% if sort == 'name' %}selected{% endif %}>Name</option>
      </select>
    </form>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-3">
    {% for p in products %}
    {% include "core/_product_card.html" with square=True hide_badge=True %}
    {% empty %}
    <p class="col-span-full text-center text-sm text-gray-400 py-20">New pieces are coming soon.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
