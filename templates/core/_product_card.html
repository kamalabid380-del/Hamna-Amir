<a href="{% url 'product' p.slug %}" class="block group">
  <div class="zoom-box relative aspect-[3/4] bg-gray-50">
    {% if p.image %}
    <img src="{{ p.image.url }}" alt="{{ p.name }}" loading="lazy" class="w-full h-full object-cover">
    {% endif %}
    {% if p.is_new %}
    <span class="absolute top-3 left-3 bg-white/90 px-2 py-1 text-[9px] tracking-[0.2em] uppercase">New</span>
    {% endif %}
  </div>
  <h3 class="mt-3 text-xs sm:text-sm text-gray-800 leading-snug">{{ p.name }}</h3>
  <p class="mt-1 text-xs text-gray-500">Rs. {{ p.price|floatformat:"0" }}</p>
</a>
